<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e2a24"><meta name="description" content="Confirmación de donación"><title>Gracias por sembrar | Sembrando con Amor a las Naciones</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="icon" type="image/jpeg" href="assets/logo-sembrando-con-amor.jpg"></head><body><main class="success-shell"><div class="success-card"><img class="success-logo" src="assets/logo-sembrando-con-amor.jpg" alt="Sembrando con Amor a las Naciones"><div class="success-icon" id="successIcon">✓</div><p class="eyebrow light">Gracias por sembrar</p><h1 id="successTitle">Estamos verificando tu aportación.</h1><p id="successText">Un momento mientras confirmamos la sesión de pago con Stripe.</p><div class="success-details" id="successDetails"></div><a class="btn btn-accent" href="index.html">Volver al inicio</a></div></main><script>const p=new URLSearchParams(location.search),id=p.get('session_id'),title=document.getElementById('successTitle'),txt=document.getElementById('successText'),detail=document.getElementById('successDetails'),icon=document.getElementById('successIcon');async function run(){if(!id){title.textContent='No encontramos una sesión para verificar.';txt.textContent='Si realizaste una aportación, revisa el comprobante enviado por el procesador de pagos.';icon.textContent='i';return}try{const r=await fetch('/api/verify-donation-session?session_id='+encodeURIComponent(id)),d=await r.json();if(r.ok&&d.confirmed){title.textContent='Tu aportación fue confirmada. Gracias.';txt.textContent='Tu generosidad puede convertirse en formación, herramientas y nuevas oportunidades.';if(Number.isFinite(d.amount_total)){detail.textContent='Aportación confirmada: '+new Intl.NumberFormat('es-MX',{style:'currency',currency:(d.currency||'usd').toUpperCase()}).format(d.amount_total/100);detail.classList.add('show')}}else{title.textContent='La sesión todavía no aparece como confirmada.';txt.textContent='No realizaremos ninguna afirmación de pago hasta recibir confirmación de Stripe.';icon.textContent='i'}}catch(e){title.textContent='No pudimos verificar la sesión en este momento.';txt.textContent='Revisa el comprobante de Stripe o contacta a la fundación cuando sus canales oficiales estén publicados.';icon.textContent='i'}}run()</script></body></html>
